[pytest]
testpaths = tests
pythonpath = .
# netCDF4 1.7.3 and 1.7.4 set .shape on a NumPy array inside Variable.__setitem__,
# NumPy 2.5 warns about that on every write. Not our code, remove this line once
# netCDF4 is fixed.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
